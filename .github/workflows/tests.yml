name: LumiDex tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: lumidex-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
      - name: One-time Explorer API live smoke (feature PR only)
        if: github.event_name == 'pull_request' && github.head_ref == 'dev/explorer-direct-import'
        env:
          LUMIDEX_EXPLORER_SMOKE: '1'
        run: node --test tests/explorer-live.test.cjs
